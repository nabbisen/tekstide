# The blocking build/test gate (RFC-029 D1, D2, D3, PR-029-B).
#
# **What this job covers, and only this**: `cargo fmt --check`, `clippy --workspace
# --all-targets --all-features -- -D warnings`, `cargo test --doc --workspace`, and
# the full workspace test suite (`--all-targets --no-fail-fast`) against a short,
# fixed `TMPDIR`, asserting it is empty afterward. This is exactly the local gate
# `rfcs/handoffs/release-checklist.md`'s own "Required Gates" section runs by hand —
# a weaker subset here would be a claim about a gate that was not actually run (D2).
#
# **What this job does NOT cover, named here so a green badge is never read as more
# than it is (D4, `what-the-installer-must-not-do.md` §7)**: the Run It gate, the
# book-against-the-changelog sweep, the release checklist's packaging/publish/audit
# steps, and anything needing a real display (these all stay human, by design, and
# none of them run headlessly on a CI runner). A green run here is necessary for a
# release candidate; it is not sufficient.
#
# **Nor does it run anything `#[ignore]`d.** `test --all-targets` skips those tests
# by default, which is exactly what keeps a quarantined flake out of this blocking
# gate -- but D1's own second sentence asks for a *separate, non-blocking* job that
# runs them anyway and is read, not ignored, and no such job exists here. Found at
# review 553, after this RFC had already closed; reserved as RFC-072, which is also
# where the real question lives -- most of this workspace's `--ignored` tests are
# measurements and hand-run diagnostics, not flake quarantines, and a job reading
# all of them would be red for reasons that are not findings on its first day.
#
# **D1's own prerequisite**: this job became trustworthy to make blocking only after
# `rfcs/handoffs/test-process-leak.md`'s every live row carried a verdict
# (RFC-029 PR-029-A) — a gate that is red when nothing is wrong teaches everyone to
# ignore red, which is the one thing this project's whole method depends on not
# happening.
#
# **Rust toolchain: the runner's own preinstalled `rustup` is used, updated to the
# latest `stable` and given the two components this gate needs.** Not pinned to an
# exact version the way `mdbook` is in `docs.yml`: a bare download has no integrity
# check of its own, which is what that pin and its checksum exist to supply, but
# `rustup`'s own installation and update path verifies what it fetches itself, so a
# second, hand-maintained version pin here would buy nothing `rustup` does not
# already provide, at the real cost of this gate silently aging behind what `cargo
# fmt`/`clippy` actually enforce on a contributor's own up-to-date machine. The
# installed version is printed every run, so a drift is visible in the log, not
# hidden. **This means the toolchain floats deliberately**: Rust ships a new
# `stable` roughly every six weeks, and a new release can start failing `cargo
# fmt --check` or `clippy -D warnings` on code this repository never changed. A
# red run here with no corresponding diff is that, not a regression -- the fix
# is to adopt the new lint (or, rarely, file it upstream), not to go hunting for
# what broke.
#
# **First-party actions only, each pinned to a commit SHA with its tag in a trailing
# comment** (`docs.yml`'s own rule, inherited unchanged, D3): the single `uses:` step
# below reuses the identical `actions/checkout` pin `docs.yml` already carries.
#
# **No `paths:` filter.** A workspace-wide build/test gate has no subset of the repo
# it can safely ignore -- the same reasoning `docs.yml`'s own header already gives for
# itself, reached independently here for a different set of files.
#
# **The second job, `macos-measurement` (RFC-028 D7, PR-028-A through F): started
# as a live, continuous measurement of distance from a macOS build, now fully
# blocking.** `continue-on-error: true` at the job level was the same
# advisory-then-blocking shape this file's own `gate` job and RFC-072's quarantine
# job both use for a different artefact -- a red result there was the expected
# outcome, not a failure of the job or the slice that added it. It runs on every
# push to `main`, the same as `gate`, so the next compile error anyone introduces
# is caught the moment it is written rather than at the next point-in-time audit
# (this RFC's own evidence table was exactly such an audit, already stale by the
# time it was reviewed).
#
# RFC-028 D5, review 595: build reached zero errors on 2026-10-17 (`39bf840`), so
# this job started also running the real test suite -- the first time any test in
# this workspace executed on a second platform. PR-028-C's own `/dev/fd` TOCTOU
# test runs here, as do `WakeSignal`'s own runner-only checks (review 593's
# CLOEXEC postcondition and wake-contract tests, and the `poll(2)`-on-a-kqueue-fd
# assumption `poll_for_readiness` documents as unverifiable anywhere but here).
#
# **Flipped to fully blocking, PR-028-F, once PR-028-A through E had all landed
# and run `40885095023`/`40887584231` confirmed green, build and test both** (the
# job keeps its own name rather than being renamed, since it still runs the real
# measurements the two steps below name). "Fully blocking" means exactly what the
# job-level setting below says: a macOS failure now fails this workflow run. It
# does **not** mean a red run blocks a push by itself -- branch protection on this
# repository deliberately does not require status checks (`release-checklist.md`'s
# own "Required Gates" note has the full reasoning), so enforcement of a red gate
# still lives there, run by a human before tagging, exactly as it already does for
# Linux.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Short and fixed, matching this project's own established convention
  # (`rfcs/handoffs/test-process-leak.md`, `release-checklist.md`): a long
  # `TMPDIR` can push a real `AF_UNIX` socket path (the approval channel,
  # the attention socket) past `sockaddr_un`'s ~108-byte capacity, which is
  # exactly the failure `0.36.0` shipped a named refusal for rather than
  # leaving generic -- the same limit applies on a runner, not only on a
  # developer's own machine.
  CI_TMPDIR: /tmp/tci

jobs:
  gate:
    runs-on: ubuntu-latest
    # Review 598: this job finishes in ~4-5 minutes; 15 is a generous
    # margin, not a measured bound. Every job in this file got one after
    # a job with none sat blocked for 5+ hours (see macos-measurement's
    # own, below) -- a job with no timeout is the workflow-level version
    # of an unbounded wait() on a value that might be wrong.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust (rustup's own update path, components added)
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test --doc --workspace
        run: cargo test --doc --workspace

      - name: cargo doc --workspace --no-deps -- -D warnings
        # Review 563/572: broken intra-doc links (a doc comment linking to a
        # private item, or to one renamed/removed since) are a different
        # defect class from `clippy -D warnings` above -- `cargo test --doc`
        # runs doctests and says nothing about whether a link resolves, so
        # nothing in this gate checked it before this step existed. Added
        # only once the count was genuinely zero on both crates (37 + 31
        # warnings found and fixed, review 572's own cleanup) -- added with
        # live warnings already present, this would have turned red on its
        # first run for reasons nobody introduced that day. The precedent
        # is `test-process-leak.md`'s own quarantine discipline: a
        # known-failing thing is tracked outside the blocking gate until
        # it is actually fixed, not added to the gate pre-broken.
        run: |
          set -euo pipefail
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: cargo build --workspace --bins
        # `release-checklist.md`'s own "Package Smoke" lesson, hit for real on the
        # first live run of this workflow rather than only read about: several
        # tests spawn a real `[[bin]]` helper (`reference_adapter`,
        # `project_process_probe`, `audit_store_create_probe`) as a child process
        # at runtime via `Command::new`, which is not a linked dependency `cargo
        # test --all-targets` builds as a side effect on a clean `target/`. A
        # developer's own machine usually has these already built from earlier
        # work in the same `target/` directory, which is exactly why this gap
        # stayed invisible locally and only showed up here, on a fresh runner.
        run: cargo build --workspace --bins

      - name: cargo test --workspace --all-targets --no-fail-fast
        run: |
          set -euo pipefail
          rm -rf "$CI_TMPDIR"
          mkdir -p "$CI_TMPDIR"
          TMPDIR="$CI_TMPDIR" cargo test --workspace --all-targets --no-fail-fast

      - name: Assert 0 fixture entries left
        run: |
          set -euo pipefail
          leftover="$(find "$CI_TMPDIR" -mindepth 1 2>/dev/null || true)"
          if [ -n "$leftover" ]; then
            echo "fixture entries left behind under \$TMPDIR ($CI_TMPDIR):"
            echo "$leftover"
            exit 1
          fi
          echo "0 fixture entries left."

  macos-measurement:
    # RFC-028 PR-028-F: fully blocking now -- see this file's own header.
    runs-on: macos-latest
    # Review 598: this job sat blocked for 5h05m (GitHub's own 6-hour
    # job default) after a real hang in newly-ported macOS code, back
    # when `continue-on-error: true` (removed, PR-028-F) made it easy to
    # forget this job could still run for hours on every single push
    # until someone noticed and cancelled it by hand. 30 minutes is
    # generous against this job's own ordinary ~3-4 minutes (build +
    # test, no macOS runner queueing counted against it -- GitHub does
    # not charge queue time against a job's own timeout), not a measured
    # ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust (rustup's own update path)
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace --all-targets --no-fail-fast
        run: |
          set -euo pipefail
          rm -rf "$CI_TMPDIR"
          mkdir -p "$CI_TMPDIR"
          TMPDIR="$CI_TMPDIR" cargo test --workspace --all-targets --no-fail-fast

      - name: libproc-visibility measurement (--nocapture)
        # Review 627: this crate's own test harness only prints a test's
        # captured stdout/stderr when that test fails, and
        # `libproc_visibility_plain_child_vs_pty_child_and_a_non_libproc_
        # view` asserts nothing by design (a measurement, not a test) --
        # so the step above ran it, it passed, and its own two `eprintln!`
        # lines (the entire point of the experiment) went into a buffer
        # this job's log never showed. A dedicated step, not a flag added
        # to the suite-wide run above: `--nocapture` on the whole suite
        # would drown this one measurement in every other test's own
        # stdout, and this binary is already built by the step above, so
        # this costs a handful of seconds, not a rebuild. The general
        # rule, stated once rather than rediscovered: a measurement that
        # is only visible when some other test fails is not a
        # measurement; any future probe either asserts (and is a test,
        # covered above) or gets its own step like this one.
        #
        # `if: always()`: a step whose own predecessor failed is
        # *skipped* by default regardless of the job's own pass/fail
        # outcome, which is exactly why this measurement went missing the
        # first time this step existed: it never ran at all, on a run
        # where the prior step did fail. Still needed now that the job is
        # fully blocking (PR-028-F) -- this measurement step asserts a
        # real property of its own and should run whether or not the
        # suite-wide step above found something else wrong.
        if: always()
        run: |
          set -euo pipefail
          TMPDIR="$CI_TMPDIR" cargo test -p tekstide-core --lib \
            runtime::terminal::tests::libproc_visibility_plain_child_vs_pty_child_and_a_non_libproc_view \
            -- --exact --nocapture

      - name: kern-proc-session measurement (--nocapture)
        # Review 635's own control call fires unconditionally, not only
        # in the failure branch -- but the suite-wide run above only
        # prints a test's captured stdout/stderr when that test fails,
        # so a *passing* run of
        # `a_real_backgrounded_job_is_dead_after_a_real_close` produces
        # the control's own `eprintln!` output and then discards it,
        # exactly the libproc-visibility step's own lesson above: a
        # measurement that is only visible on failure is not a
        # measurement. Separate step, same reasoning, same `if:
        # always()`.
        if: always()
        run: |
          set -euo pipefail
          TMPDIR="$CI_TMPDIR" cargo test -p tekstide-core --lib \
            runtime::terminal::tests::a_real_backgrounded_job_is_dead_after_a_real_close \
            -- --exact --nocapture

      - name: macOS approval-socket headroom measurement against the real ambient $TMPDIR (review 651 B1, --nocapture)
        # **Deliberately does NOT set TMPDIR.** Every step above pins it to
        # `$CI_TMPDIR` (`/tmp/tci`, 8 bytes) so the rest of the suite does not
        # redden on an unrelated sockaddr_un overflow -- which means the
        # suite's own own headroom test
        # (`the_macos_socket_path_leaves_comfortable_headroom_under_the_real_limit`)
        # has never measured this runner's real per-session anchor
        # (`/var/folders/.../T`, which `channel_dir_under`'s macOS arm
        # canonicalizes to `/private/var/folders/.../T`). Review 651's own
        # arithmetic over the real production code predicts the approval
        # socket is already over `sun_path`'s 103-byte limit for all but an
        # unusually short anchor. This step is the one place that measures
        # rather than predicts: it asserts nothing and changes nothing it
        # observes, so (per this project's own "pure diagnostics may skip
        # the review turn" rule) it runs here before, not after, a decision
        # about whether or how to fix it.
        if: always()
        run: |
          set -euo pipefail
          cargo test -p tekstide-core --lib \
            approval::tests::channel::macos_approval_socket_path_headroom_measurement_against_the_real_ambient_tmpdir \
            -- --exact --nocapture --ignored

      - name: macOS attention-socket headroom measurement against the real ambient $TMPDIR (review 651 B1, --nocapture)
        # Same reasoning as the approval-socket step immediately above, for
        # `attention_socket_dir`'s own macOS arm -- which does not
        # canonicalize its anchor, unlike the approval channel's. Review
        # 651's own arithmetic predicts this one is over the limit
        # unconditionally, for any realistic per-session $TMPDIR shape.
        if: always()
        run: |
          set -euo pipefail
          cargo test -p tekstide-core --lib \
            project_lock::attention::tests::macos_attention_socket_path_headroom_measurement_against_the_real_ambient_tmpdir \
            -- --exact --nocapture --ignored

      - name: Cold-start window capture (RFC-028 D2, PR-028-F scope item 2, review 650 round 3)
        # `pr-028-f-scope-additions.md` §2: this runner has a real window server, but nobody
        # has measured whether screen capture is even reachable on it -- TCC-governed, and
        # the GUI rules' own repeat-limit applies at the level of this whole question, not
        # of retries inside it: one attempt; a refusal here is the answer and is not worth a
        # second try.
        #
        # Throwaway `$HOME`, not `XDG_CONFIG_HOME`/`XDG_STATE_HOME` -- corrected 2026-10-29,
        # review 650: `ConfigPathProvider::macos_from_env`/`AppStatePathProvider::macos_from_env`
        # (`crates/tekstide-core/src/config/path.rs`,
        # `crates/tekstide-core/src/project/recent/store.rs`) resolve `$HOME/Library/
        # Application Support/tekstide` from `$HOME` alone on this platform and read neither
        # `XDG_*` variable, so only `$HOME` isolates anything here -- never the maintainer's
        # own account, which this runner does not have anyway, but the principle is the same
        # one `project-instructions-gui-common.md` states for a developer's own machine.
        #
        # Cold start only, no project opened: answers whether the window opens at all and
        # whether the chrome looks like a macOS window. The Help-modal glyph question (does
        # `⌘`/`⌥`/`⇧` draw as a real glyph) is answered by a font-coverage test instead, not
        # by this picture -- driving the modal open would need keyboard automation this
        # project has no macOS equivalent of yet.
        #
        # No resize after launch: the binary opens at its own default size, stated here
        # rather than chosen, and nothing below moves or resizes the window afterward.
        #
        # A full-screen capture, not a window-targeted one: this runner shows nothing else,
        # and AppleScript window-targeting is exactly the kind of thing not to improvise
        # untested, under a rule that allows only one attempt.
        #
        # **A readiness signal, not a fixed sleep or a before/after comparison -- added
        # review 650 round 3, retiring both earlier attempts in turn.** The fixed sleep (round
        # 1) captured a blank desktop on its own second run, no crash logged. The before/after
        # screenshot comparison (round 2) "passed" on the very next run and still captured no
        # window: `imagemagick compare` showed the only pixels that differed were inside the
        # Dock (a launch bounce), with the menu bar still reading "Finder" -- proof that *some*
        # screen change is not evidence of *this app's own window*. The app itself now reports
        # when it has actually painted: `Message::FirstFramePresented` (`shell.rs`), driven by
        # `iced::window::frames()` the same way `measurement`'s own `Criterion::Startup` already
        # does, prints `TEKSTIDE_FIRST_FRAME_PRESENTED` to stderr exactly once. This step polls
        # `launch.log` for that line with a bounded budget (10s, generous against the ~3s the
        # successful runs so far have taken) instead of guessing a sleep or trusting that
        # *something* on screen changed.
        if: always()
        run: |
          set -euo pipefail
          mkdir -p capture-evidence
          CAPTURE_HOME="$(mktemp -d)"
          HOME="$CAPTURE_HOME" ./target/debug/tekstide >capture-evidence/launch.log 2>&1 &
          TEKSTIDE_PID=$!
          READY=0
          for _ in $(seq 1 100); do
            if grep -q "TEKSTIDE_FIRST_FRAME_PRESENTED" capture-evidence/launch.log 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$TEKSTIDE_PID" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if [ "$READY" -ne 1 ]; then
            echo "the app never presented a frame (TEKSTIDE_FIRST_FRAME_PRESENTED not seen within the wait budget):"
            cat capture-evidence/launch.log
            kill "$TEKSTIDE_PID" 2>/dev/null || true
            exit 1
          fi
          screencapture -x capture-evidence/macos-cold-start.png
          kill "$TEKSTIDE_PID" 2>/dev/null || true
          wait "$TEKSTIDE_PID" 2>/dev/null || true
          file capture-evidence/macos-cold-start.png
          sips -g pixelWidth -g pixelHeight capture-evidence/macos-cold-start.png

      - name: Upload the macOS cold-start capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-cold-start-capture
          path: capture-evidence/
          if-no-files-found: ignore
          retention-days: 14
