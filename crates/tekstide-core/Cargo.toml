[package]
name        = "tekstide-core"
description = "Core domain, security, project, and content models for Tekstide."
readme      = "README.md"
version.workspace       = true
edition.workspace       = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
categories.workspace    = true
keywords.workspace      = true
# RFC-050 PR-050-A: `File::try_lock` is stable from 1.89, and this crate's
# transcript writer and loader both use it. Measured for 0.19.0, not assumed:
# 1.88.0 fails to compile this crate with `error[E0658]: use of unstable
# library feature 'file_lock'` at both call sites, and 1.89.0 builds it.
rust-version            = "1.89"

[lib]
path = "src/lib.rs"

[dependencies]
libc.workspace              = true
serde.workspace             = true
serde_json.workspace        = true
toml.workspace              = true
uuid.workspace              = true
rusqlite.workspace          = true

# RFC-043 PR-043-A: `#[cfg(test)]` only activates when this crate's own
# test suite is what's compiling -- it cannot see a *consuming* crate's
# test mode across the dependency boundary. `tekstide`'s own tests (where
# most real terminal launches actually happen) need the D4 leak guard
# active too, so `tekstide/Cargo.toml`'s `[dev-dependencies]` enables
# this feature on top of the normal dependency; Cargo unifies the two
# into one build for `cargo test -p tekstide`. Never enabled by a
# release build, since only a dev-dependency turns it on.
[features]
test-support = []
