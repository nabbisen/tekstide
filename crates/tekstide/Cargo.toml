[package]
name        = "tekstide"
description = "Terminal/runtime foundation for a local-first multi-project AI development workbench."
readme      = "../../README.md"
version.workspace       = true
edition.workspace       = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
categories.workspace    = true
keywords.workspace      = true

[[bin]]
name = "tekstide"
path = "src/main.rs"

[dependencies]
tekstide-core               = { workspace = true }
iced                        = { workspace = true }
fluent-bundle               = { workspace = true }
unic-langid                 = { workspace = true }
sys-locale                  = { workspace = true }
alacritty_terminal          = { workspace = true }
vte                         = { workspace = true }

[dev-dependencies]
iced_futures                = { version = "0.14" }
# RFC-043 PR-043-A: activates tekstide-core's D4 leak guard for this
# crate's own tests too -- see that crate's Cargo.toml for why `[features]`
# rather than `#[cfg(test)]` is what crosses the dependency boundary.
tekstide-core                = { workspace = true, features = ["test-support"] }
