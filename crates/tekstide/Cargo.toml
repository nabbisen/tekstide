[package]
name        = "tekstide"
description = "Terminal/runtime foundation for a local-first multi-project AI development workbench."
readme      = "../../README.md"
version.workspace       = true
edition.workspace       = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
categories.workspace    = true
keywords.workspace      = true
# Higher than `tekstide-core`'s 1.89, and for a dependency's reason rather than
# this crate's own: `ordered-float 5.5.0`, reached through `iced`, declares
# `rust-version = "1.90"`, so a `--locked` build of this crate refuses 1.89
# before compiling anything. Measured for 0.19.0: 1.89.0 refuses, 1.90.0 and
# 1.91.0 both build the workspace.
rust-version            = "1.90"

[[bin]]
name = "tekstide"
path = "src/main.rs"

[dependencies]
tekstide-core               = { workspace = true }
iced                        = { workspace = true }
fluent-bundle               = { workspace = true }
unic-langid                 = { workspace = true }
sys-locale                  = { workspace = true }
alacritty_terminal          = { workspace = true }
vte                         = { workspace = true }

[dev-dependencies]
iced_futures                = { version = "0.14" }
# RFC-043 PR-043-A: activates tekstide-core's D4 leak guard for this
# crate's own tests too -- see that crate's Cargo.toml for why `[features]`
# rather than `#[cfg(test)]` is what crosses the dependency boundary.
tekstide-core                = { workspace = true, features = ["test-support"] }
