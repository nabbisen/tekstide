[workspace]
resolver = "3"
members = [
    "crates/tekstide",
    "crates/tekstide-core",
]

[workspace.package]
version         = "0.37.0"
edition         = "2024"
license             = "Apache-2.0"
authors             = ["nabbisen"]
repository          = "https://github.com/nabbisen/tekstide"
categories          = ["command-line-utilities", "development-tools"]
keywords            = ["workspace", "developer-tools", "ai", "cli"]

[workspace.dependencies]
# RFC-056 PR-056-A: pinned to this release's own version, **not** `"0"`. `"0"` means any 0.x and opts out of
# Cargo's rule that 0.26 and 0.25 are incompatible, so every published `tekstide` up to `0.26.0` resolves the
# *newest* core: `cargo install tekstide --version 0.25.0` stopped compiling the day `0.26.0` added three public
# enum variants. Bumped **with every release** -- `the_workspace_pins_tekstide_core_to_its_own_version` fails if
# this and `[workspace.package] version` disagree.
tekstide-core               = { version = "0.37.0", path = "crates/tekstide-core" }

libc                        = "0.2"

# RFC-026 D4, adopted at review 452: non-recursive per-directory watches only, so
# the default `macos_fsevent` feature (macOS-only) is off. Re-check row: the 9.0 line
# (release candidates since 2026-01-25; see rfcs/handoffs/dependency-advisories.md).
#
# RFC-028 D2: `macos_fsevent` off (above) with no replacement left every `cfg(all(
# target_os = "macos", not(feature = "macos_kqueue")))` path in `notify`'s own
# `src/lib.rs` compiling in a backend that needs `fsevent-sys`, which was never
# pulled in -- a macOS build breaks today, regardless of anything this project adds.
# `macos_kqueue` is the fix, not re-enabling `macos_fsevent`: `kqueue` needs no
# `FSEvents`-style elevated privilege, and RFC-026 D4's own non-recursive design
# never needed `FSEvents`' native recursive-tree behaviour anyway. Inert on
# Linux/Windows -- every gate it un-gates in `notify`'s own source is additionally
# `cfg(target_os = "macos")`.
notify                      = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
# THROWAWAY MEASUREMENT (review 647 Round 2, Order item 2) -- the line
# above is temporarily `macos_fsevent`, not `macos_kqueue`, to measure
# whether the `FSEvents` backend reports a content write to an existing
# file where `kqueue` does not (`reading_a_watched_file_is_not_reported_
# but_writing_it_is`'s own macOS failure). Expected to be reverted by the
# very next commit; do not build on it.

serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"
toml                        = "1"
uuid                        = { version = "1", features = ["v4"] }
rusqlite                    = { version = "0.40", default-features = false, features = ["bundled"] }

iced                        = { version = "0.14", features = ["tokio", "advanced"] }
alacritty_terminal          = "0.26"
vte                         = "0.15"

fluent-bundle               = "0.16"
unic-langid                 = "0.9"
sys-locale                  = "0.3"
